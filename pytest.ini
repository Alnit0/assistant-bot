[pytest]
testpaths = tests
# What a test prints is kept in memory, not in a file read back after every test (a few
# seconds of the run on Windows)
addopts = --capture=sys
markers =
    real_threads: the bot's blocking work goes to worker threads, as on live (tests/conftest.py)
    real_connections: every database connection is opened and closed for real (tests/conftest.py)
# discord.py's own use of a deprecated asyncio call, seen when main.py is imported
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord
